<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Minas Explorer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Minas Gerais está mais perto do que você imagina.">
  <meta name="color-scheme" content="light dark">
  <!-- Aplica o tema escolhido antes do primeiro render (evita "flash" de tema errado). Ver ThemeService. -->
  <script>
    try {
      var t = localStorage.getItem('minas-explorer:theme:v1');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* sem LocalStorage: segue o sistema */ }
  </script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
