<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Página não encontrada – Minas Explorer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="/minas-explorer/favicon.svg">
  <style>
    :root { --bg: #faf8f3; --ink: #1d2a24; --brand: #1f4d3a; --muted: #55645b; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111a15; --ink: #e6eee8; --brand: #8fd0a8; --muted: #a6b5ac; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
      background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
    main { max-width: 36rem; }
    h1 { font-family: Georgia, 'Times New Roman', serif; color: var(--brand); font-size: clamp(1.75rem, 5vw, 2.5rem); margin: 0 0 12px; }
    p { color: var(--muted); line-height: 1.6; margin: 0 0 24px; }
    a { display: inline-block; padding: 12px 24px; border-radius: 999px; background: var(--brand); color: var(--bg); font-weight: 600; text-decoration: none; }
    a:focus-visible { outline: 3px solid #0b5fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Página não encontrada</h1>
    <p>O endereço que você abriu não existe no Minas Explorer. Minas Gerais está mais perto do que você imagina: volte ao mapa e continue explorando.</p>
    <!-- Caminho absoluto de propósito: esta página é servida a partir de qualquer endereço inexistente. -->
    <a href="/minas-explorer/">Voltar ao Minas Explorer</a>
  </main>
</body>
</html>
