<div class="me-filters">
  <section aria-labelledby="flt-cat">
    <h3 id="flt-cat" class="me-filters__title">Categorias <span class="me-filters__hint">(também é a legenda do mapa)</span></h3>
    <mat-chip-listbox class="me-filters__chips" aria-label="Filtrar por categoria" multiple>
      @for (cat of store.categories(); track cat.id) {
        <mat-chip-option
          [selected]="store.categoryIds().includes(cat.id)"
          (selectionChange)="onCategoryChange(cat.id, $event.selected)"
          [style.--cat-color]="cat.color"
        >
          <me-icon matChipAvatar [name]="cat.icon" [size]="16" />
          {{ cat.name }}
        </mat-chip-option>
      }
    </mat-chip-listbox>
  </section>

  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="me-filters__region">
    <mat-label>Região</mat-label>
    <mat-select [value]="store.regionId()" (selectionChange)="store.setRegion($event.value)">
      <mat-option [value]="null">Todas as regiões</mat-option>
      @for (region of store.regions(); track region.id) {
        <mat-option [value]="region.id">{{ region.name }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  @if (store.filtersActive()) {
    <button matButton type="button" class="me-filters__clear" (click)="store.clearFilters()">
      <me-icon name="filter-x" [size]="18" />
      Limpar filtros
    </button>
  }
</div>
