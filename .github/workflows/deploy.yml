name: Deploy no GitHub Pages

# Publica o site em https://<usuario>.github.io/minas-explorer/ a cada push na main.
# Antes do primeiro deploy: Settings > Pages > Build and deployment > Source = "GitHub Actions"
# (ver docs/publicacao.md). Também pode ser executado manualmente (Actions > Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Só o necessário para publicar no Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; um novo push cancela o que ainda não terminou de publicar.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # o Angular 22 exige Node ^22.22.3, ^24.15.0 ou >=26
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes (valida o catálogo e roda a suíte)
        run: npm test

      - name: Build de produção com base href do Pages
        run: npm run build:pages

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/minas-explorer/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
