<article class="me-card" [class.me-card--selected]="selected()" [class.me-card--compact]="compact()">
  <div class="me-card__media">
    @if (showImage()) {
      <img [src]="imageUrl()" [alt]="imageAlt()" loading="lazy" (error)="onImageError()" />
    } @else {
      <div class="me-card__placeholder" role="img" aria-label="Imagem indisponível">
        <svg lucideImageOff [size]="32" aria-hidden="true"></svg>
      </div>
    }
    @if (category() && !compact()) {
      <span class="me-card__chip" [style.--chip-color]="categoryColor()">
        @if (categoryIcon()) {
          <me-category-icon [name]="categoryIcon()" [size]="14" />
        }
        {{ category() }}
      </span>
    }
  </div>
  <div class="me-card__body">
    <h3>
      <button type="button" class="me-card__title" [attr.aria-pressed]="selected()" (click)="activated.emit()">{{ name() }}</button>
    </h3>
    @if (city()) {
      <p class="me-card__city">{{ city() }}</p>
    }
    @if (category() && compact()) {
      <p class="me-card__category" [style.--chip-color]="categoryColor()">
        @if (categoryIcon()) {
          <me-category-icon [name]="categoryIcon()" [size]="14" />
        }
        {{ category() }}
      </p>
    }
    <div class="me-card__actions"><ng-content /></div>
  </div>
</article>
